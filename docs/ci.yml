name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgschema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGSCHEMA_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/pgschema_test?sslmode=disable
      PGSCHEMA_RO_DSN: postgres://postgres:postgres@127.0.0.1:5432/pgschema_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: build
        run: make build
      - name: self-test
        run: ./bin/pgschema self-test
      - name: doctor
        run: ./bin/pgschema doctor --dsn "$PGSCHEMA_RO_DSN"

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: build release artifacts
        run: make release
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pgschema-*.tar.gz
            dist/sha256sums.txt
